[project]
name = "tender"
version = "0.1.0"
description = "Tender & bid compliance checker: every requirement your bid misses, with page numbers (AWS Bedrock only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic[bedrock]>=2.6.0",
    "fastapi>=0.115",
    "google-genai>=1.50",
    "httpx>=0.28",
    "langchain-core>=1.0",
    "langchain-qdrant>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pymupdf>=1.26",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "qdrant-client>=1.15",
    "rapidfuzz>=3.14.6",
    "rich>=13",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
tender = "tender.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcore", "tender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
