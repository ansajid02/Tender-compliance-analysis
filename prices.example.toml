# USD per 1M tokens, used to compute cost in traces and evals. Copy to prices.toml (make setup does this).
# Models not listed here get cost = unknown ("?" in reports). Thinking tokens count as output tokens.

[models]

# Google Gemini, paid tier (Standard), from https://aistudio.google.com/docs/pricing on 2026-11-15.
# Output includes thinking tokens. DATED CHANGES: gemini-3.6/3.8-flash double on 2027-01-01
# (1.50 / 7.50); gemini-4-argon/carbon double on 2026-12-01 (4.00 / 20.00). Update these then.
# Batch API = 50% of these.
[models."gemini-3.6-flash"]
input = 0.75
output = 3.75

[models."gemini-3.8-flash"]
input = 0.75
output = 3.75

[models."gemini-3.1-flash-lite"]
input = 0.25
output = 1.50

[models."gemini-4-hydrogen"]
input = 1.50
output = 7.50

[models."gemini-4-argon"]
input = 2.00
output = 10.00

[models."gemini-4-carbon"]
input = 2.00
output = 10.00

# embeddings (input only; the Gemini API does not report embedding token counts, so traces show "?")
[models."gemini-embedding-001"]
input = 0.15
output = 0.0

[models."gemini-embedding-2"]
input = 0.20
output = 0.0

